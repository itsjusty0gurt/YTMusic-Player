[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-music-desktop"
dynamic = ["version"]
description = "A lightweight standalone YouTube Music desktop player for Windows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
build = [
    "PyInstaller>=6.10,<7",
]
test = [
    "pytest>=8,<10",
]

[project.scripts]
youtube-music-desktop = "ytmusic_player.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ytmusic_player = ["assets/icons/*.png", "assets/icons/*.ico"]

[tool.setuptools.dynamic]
version = {attr = "ytmusic_player.metadata.APP_VERSION"}
